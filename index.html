<style>
:root{--bg:#fafafa;--card:#fff;--ink:#222;--mute:#666;--red:#e11d2e;--red2:#c8102e;--gold:#f4a7ae;--line:#f0cfd2;--soft:#fdecee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top img{width:42px;height:42px;border-radius:50%;background:#fff}
.brand b{display:block;font-size:18px;letter-spacing:.1em}.brand small{opacity:.85;font-size:12px}
.nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
main{max-width:1000px;margin:0 auto;padding:16px}
.btn{border:1px solid var(--red);border-radius:8px;padding:8px 14px;background:var(--red);color:#fff;cursor:pointer;font:inherit}.btn.o{background:transparent;color:var(--red)}.btn.g{background:var(--gold);border-color:var(--gold);color:#222}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat b{font-size:26px;color:var(--red);display:block}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--soft);border:1px solid var(--gold)}.badge.w{background:var(--red);color:#fff;border-color:var(--red)}
.badge.y{background:#f5a623;color:#fff;border-color:#f5a623}.badge.ok{background:#2e7d32;color:#fff;border-color:#2e7d32}
.donut{width:130px;height:130px;border-radius:50%;flex:0 0 130px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.login{max-width:380px;margin:24px auto;text-align:center}.login img{width:120px;height:120px}.login h1{margin:6px 0 0;letter-spacing:.12em;color:var(--red)}.login label{text-align:left}
.modal{position:fixed;inset:0;background:#0009;display:flex;justify-content:center;overflow:auto;padding:20px;z-index:20}.modal .card{max-width:640px;width:100%;height:fit-content}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.steps span{font-size:12px;padding:4px 8px;border-radius:6px;background:var(--soft);color:var(--mute)}.steps .d{background:var(--gold);color:#222}.steps .c{background:var(--red);color:#fff}
.bars div{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}.bars span{flex:0 0 175px}.bars i{display:block;height:10px;background:var(--gold);border-radius:5px}
.err{color:#c0392b;font-size:13px;min-height:1.2em;margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
h2,h3{margin:.3em 0 .5em}a{color:var(--red)}
.ft{background:var(--soft);border-top:1px solid var(--line);padding:28px 16px 90px;margin-top:20px}
.fg{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px}
.fb{display:flex;gap:10px;align-items:center;margin-bottom:12px}.fb img{width:52px;height:52px;border-radius:50%}
.ft h2,.ft h3{color:var(--red);margin-top:0}.ft h2{font-size:30px;line-height:1.1}.ft h4{margin:.4em 0}
.ft a{display:block;color:var(--mute);text-decoration:none;padding:5px 0}.ft a:hover{color:var(--red)}
.ft p{font-size:14px}.ft .fp{text-align:center;max-width:1000px;margin:24px auto 0;font-size:12px;color:var(--mute)}
.fab{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:52px;height:52px;font-size:24px;cursor:pointer;z-index:10;padding:0}
.fab.l{left:16px;border-radius:50%;background:var(--red);color:#fff;border:3px solid #fff}.fab.r{right:16px;border-radius:12px;background:var(--card);border:3px solid var(--red)}
:root.acc{--mute:var(--ink);--line:var(--ink)}.acc body{font-size:18px}
.ft a.wa{display:inline-flex;align-items:center;gap:8px;background:#1e8e4e;color:#fff;border-radius:8px;padding:8px 14px;margin-top:8px}.ft a.wa:hover{color:#fff;opacity:.9}a.fab{display:flex;align-items:center;justify-content:center;text-decoration:none}.btn.g{background:#fff;border-color:#fff;color:var(--red)}</style></head><body><div id="app"></div><div id="ov"></div>

function dash(){const v=vis(),a=v.filter(c=>c.st<6),over=a.filter(c=>left(c)<0).length,near=a.filter(c=>{const l=left(c);return l!=null&&l>=0&&l<=7}).length;

</div><div class="tw" id="tbl"></div></div>`}
function tbl(){const q=S.q.toLowerCase(),r=vis().filter(c=>{const s=sd(c.nim),l=left(c),sla=l==null?'ok':l<0?'over':l<=7?'near':'ok';return(S.f===''||c.st==S.f)&&(!S.k||c.jenis==S.k)&&(!S.sf||S.sf==sla)&&(c.id+s.n+s.nim).toLowerCase().includes(q)});
$('#tbl').innerHTML=r.length?`<table><tr><th>ID</th><th>Terlapor</th><th>Tgl Masuk</th><th>Pelanggaran</th><th>Tahap</th><th>SLA</th><th></th></tr>${r.map(c=>{const s=sd(c.nim),l=left(c),cls=l==null?'ok':l<0?'w':l<=7?'y':'ok',lbl=l==null?'Selesai':l<0?'Lewat '+Math.abs(l)+' hr':l+' hari';return `<tr><td>${c.id}</td><td>${E(s.n)}<br><small>${s.nim} · ${s.f}</small></td><td>${c.tgl}</td><td>${E(c.jenis)}</td><td><span class="badge">${ST[c.st]}</span></td><td><span class="badge ${cls}">${lbl}</span></td><td><button class="btn o" onclick="S.sel='${c.id}';render()">Buka</button></td></tr>`}).join('')}</table>`:'<p>Tidak ada kasus.</p>'}
function detail(){const c=cases.find(x=>x.id==S.sel);if(!c||!vis().includes(c))return'';const s=sd(c.nim),l=left(c);
return `<div class="modal" onclick="if(event.target==this){S.sel=null;render()}"><div class="card"><div class="row"><h2>${c.id} · ${E(c.jenis)}</h2><button class="btn o" onclick="S.sel=null;render()">Tutup</button></div>
<p><b>Terlapor:</b> ${E(s.n)} (${s.nim}, ${s.f})<br><b>Mata kuliah:</b> ${E(c.mk)}<br><b>Pelapor:</b> ${E(c.pel)}<br><b>Tanggal lapor:</b> ${c.tgl} · <b>SLA 30 hari:</b> ${l==null?'selesai':l+' hari tersisa'}</p>
<p><b>Kronologi:</b> ${E(c.kron)}</p><p><b>Bukti:</b> ${E(c.ev)}</p>${c.sanksi?`<p><b>Rekomendasi sanksi:</b> ${E(c.sanksi)}</p>`:''}
<div class="steps">${ST.map((x,i)=>`<span class="${i<c.st?'d':i==c.st?'c':''}">${i+1}. ${x}</span>`).join('')}</div>
<h3>Riwayat</h3><ul>${c.log.map(g=>`<li>${g.t}: ${E(g.x)}</li>`).join('')}</ul>
${c.st<6&&canAct(c)?`<label>${c.st==3?'Rekomendasi sanksi (wajib)':'Catatan: BAP, keterangan pelapor &amp; saksi (opsional)'}</label><textarea id="cat" rows="3"></textarea><p><button class="btn" onclick="adv('${c.id}')">Lanjut ke: ${ST[c.st+1]}</button></p>`:''}
${S.u.r=='komisi'?`<button class="btn o" onclick="del('${c.id}')">Hapus kasus</button>`:''}${S.u.r=='wali'?'<span class="badge">Mode pantau (hanya lihat)</span>':''}</div></div>`}
function adv(id){const c=cases.find(x=>x.id==id);if(!c||!vis().includes(c)||!canAct(c))return;const n=$('#cat').value.trim();
if(c.st==3){if(!n){alert('Isi rekomendasi sanksi terlebih dahulu.');return}c.sanksi=n}
c.st++;c.log.push({t:today(),x:ST[c.st]+(n?' — '+n:'')+' (oleh '+S.u.n+')'});render()}
function del(id){if(S.u.r=='komisi'&&confirm('Hapus kasus '+id+'?')){cases=cases.filter(c=>c.id!=id);S.sel=null;render()}}
function form(){const ss=stu.filter(s=>S.u.r=='komisi'||s.f==S.u.f);
return `<div class="card"><h2>Buat Laporan Baru</h2><label>Terlapor</label><select id="fn">${ss.map(s=>`<option value="${s.nim}">${E(s.n)} (${s.nim})</option>`).join('')}</select><label>Mata kuliah</label><input id="fm"><label>Jenis pelanggaran</label><select id="fj">${['Menyontek saat ujian','Plagiarisme','Joki tugas/ujian','Pemalsuan data','Lainnya'].map(x=>`<option>${x}</option>`).join('')}</select><label>Pelapor (pengawas / dosen MK)</label><input id="fp"><label>Kronologi</label><textarea id="fk" rows="4"></textarea><label>Bukti (tautan / deskripsi)</label><input id="fe"><p class="err" id="fer"></p><button class="btn" onclick="save()">Kirim laporan</button></div>`}
function save(){const g=i=>$('#'+i).value.trim();if(!g('fm')||!g('fp')||!g('fk')){$('#fer').textContent='Mata kuliah, pelapor, dan kronologi wajib diisi.';return}
cases.unshift({id:'LP-'+String(seq++).padStart(3,'0'),nim:g('fn'),mk:g('fm'),jenis:g('fj'),pel:g('fp'),kron:g('fk'),ev:g('fe')||'-',st:0,tgl:today(),sanksi:'',log:[{t:today(),x:'Laporan diterima oleh '+S.u.n}]});S.v='dash';render()}
function usr(){const w=users.filter(u=>u.r=='wali');
return `<div class="card"><h2>Kelola Pengguna</h2>${tb(['Username','Nama','Peran'],users.map(u=>[u.u,E(u.n),RL[u.r]]))}<h3>Tambah akun</h3><div class="grid"><input id="nu" placeholder="Username"><input id="nn" placeholder="Nama lengkap"><select id="nr"><option value="wali">Dosen Wali</option><option value="kmhs">Kemahasiswaan Fakultas</option><option value="komisi">Komisi Etik</option></select><input id="nf" placeholder="Fakultas (kemahasiswaan)"><input id="np" type="password" placeholder="Password"></div><p class="err" id="uer"></p><button class="btn" onclick="addU()">Tambah</button></div>
<div class="card"><h3>Data perwalian</h3><div class="tw"><table><tr><th>Mahasiswa</th><th>Fak.</th><th>Dosen wali</th></tr>${stu.map((s,i)=>`<tr><td>${E(s.n)}<br><small>${s.nim}</small></td><td>${s.f}</td><td><select onchange="stu[${i}].w=this.value;sv()">${w.map(x=>`<option value="${x.u}" ${x.u==s.w?'selected':''}>${E(x.n)}</option>`).join('')}</select></td></tr>`).join('')}</table></div></div>`}
function addU(){const g=i=>$('#'+i).value.trim(),r=g('nr');if(!g('nu')||!g('nn')||!$('#np').value||(r=='kmhs'&&!g('nf'))){$('#uer').textContent='Lengkapi semua kolom yang wajib.';return}
if(users.some(u=>u.u==g('nu'))){$('#uer').textContent='Username sudah dipakai.';return}
users.push({u:g('nu'),n:g('nn'),r:r,p:$('#np').value,f:g('nf').toUpperCase()});render()}
function guide(){return `<div class="card"><h2>Panduan Penggunaan LAPINET</h2>
<h3>1. Masuk ke sistem</h3><p>Isi username dan password di halaman awal lalu klik <b>Masuk</b>. Menu dan fitur yang tampil menyesuaikan peran. Akun demo:</p>${tb(['Peran','Username','Password'],[['Komisi Etik','kaisershibghatullah','etik123'],['Dosen Wali','dudububu / wali2','wali123'],['Kemahasiswaan FRI','azzahramadhinar','kmhs123']])}
<h3>2. Hak akses per peran</h3>${tb(['Fitur','Komisi Etik','Dosen Wali','Kemahasiswaan'],[['Lihat kasus','Semua kasus','Hanya mahasiswa perwaliannya','Kasus fakultasnya'],['Buat laporan','✔','✖','✔'],['Verifikasi, BAP, DK-2, sidang, rekomendasi sanksi','✔','✖','✖'],['Terbitkan SK &amp; tembusan','✔','✖','✔'],['Hapus kasus, kelola akun &amp; perwalian','✔','✖','✖']])}
<h3>3. Alur penanganan kasus</h3><ol>${ST.map(x=>`<li>${x}</li>`).join('')}</ol><p>Laporan (LAA) memuat nama, NIM, jadwal, dan evidence. Batas layanan (SLA) penanganan: 30 hari sejak laporan; badge merah muncul saat sisa ≤ 7 hari. Setelah SK terbit, tembusan diberikan kepada dosen wali dan mahasiswa.</p>
<h3>4. Langkah per peran</h3><ul><li><b>Komisi Etik:</b> buka kasus di Dashboard → isi catatan → klik tombol lanjut tahap. Pada tahap Sidang Etik wajib mengisi rekomendasi sanksi.</li><li><b>Kemahasiswaan Fakultas:</b> buat laporan lewat menu Buat Laporan; setelah rekomendasi sanksi, buka kasus lalu terbitkan SK dan tembusan.</li><li><b>Dosen Wali:</b> pantau status kasus mahasiswa perwalian di Dashboard (hanya lihat).</li></ul></div>
<div class="card"><h3>5. Kebutuhan sistem</h3>${tb(['Kode','Kebutuhan','Jenis'],[['F-01','Pengguna dapat login dengan username dan password','Fungsional'],['F-02','Fitur yang tampil sesuai peran (Komisi Etik, Dosen Wali, Kemahasiswaan)','Fungsional'],['F-03','Dosen wali hanya melihat kasus mahasiswa perwaliannya','Fungsional'],['F-04','Membuat laporan pelanggaran beserta kronologi dan bukti','Fungsional'],['F-05','Memproses kasus per tahap dari laporan hingga SK','Fungsional'],['F-06','Dashboard ringkasan, pencarian, dan filter tahap','Fungsional'],['F-07','Komisi Etik mengelola akun, perwalian, dan menghapus kasus','Fungsional'],['N-01','Setiap perubahan tahap tercatat dengan pengguna dan tanggal','Nonfungsional'],['N-02','Tampilan responsif di HP dan komputer','Nonfungsional'],['N-03','Produksi: password di-hash, koneksi HTTPS, log audit permanen','Nonfungsional']])}
<h3>6. Pendekatan pengembangan</h3>${tb(['Pendekatan','Penerapan pada LAPINET'],[['Berurutan (dokumentasi &amp; tahapan jelas)','Inisiasi → Analisis → Perancangan → Implementasi → Evaluasi, tiap tahap punya dokumen: tujuan &amp; ruang lingkup, kebutuhan (halaman ini), model proses/data/arsitektur, kode, hasil uji.'],['Iteratif','Iterasi 1: login &amp; hak akses. Iterasi 2: alur kasus &amp; SLA. Iterasi 3: notifikasi email &amp; integrasi API. Iterasi 4: evaluasi dan perbaikan.'],['Agile (responsif terhadap perubahan)','Review tiap iterasi bersama Komisi Etik, dosen wali, dan kemahasiswaan; backlog fitur diprioritaskan ulang sesuai masukan.'],['Prototyping','Versi ini adalah prototipe dengan data demo yang tersimpan di browser perangkat ini saja (tidak dibagikan antar perangkat) untuk memperoleh umpan balik pengguna dengan cepat; bukan untuk data nyata.']])}</div>`}
const IN={

f2:['Jaminan Kerahasiaan (Perlindungan Pelapor)','Identitas pelapor dan saksi hanya dapat dilihat oleh pihak yang berwenang menangani kasus. Permintaan perlindungan pelapor dapat disampaikan ke Komisi Etik.'],
f3:['Kategori Pelanggaran','Pelanggaran dikelompokkan menjadi ringan, sedang, dan berat berdasarkan dampak dan tingkat kesengajaan. Penentuan akhir dilakukan Komisi Etik dalam sidang etik sesuai peraturan universitas.'],
f4:['SLA &amp; Timeline (30 Hari)','Penanganan kasus ditargetkan selesai dalam 30 hari sejak laporan diterima hingga SK Fakultas terbit. Sisa waktu setiap kasus tampil di dashboard.'],

a2:['SOP Penanganan BAP','Alur kerja teknis: pemeriksaan oleh LAA, panggilan terlapor (DK-2), sidang etik, rekomendasi sanksi, hingga SK Fakultas.'],
a3:['Standar Alat Bukti (Evidence)','Bukti yang valid dapat berupa tangkapan layar, dokumen, atau berkas fisik. Sertakan nama, NIM, mata kuliah, tanggal/jadwal, dan keterangan singkat.'],
a4:['Matriks Sanksi &amp; Definisi Kecurangan','<div class="tw"><table><tr><th>Bentuk pelanggaran</th><th>Contoh potensi sanksi</th></tr><tr><td>Plagiarisme</td><td>Nilai E pada tugas / mata kuliah</td></tr><tr><td>Kecurangan ujian</td><td>Nilai E pada mata kuliah</td></tr><tr><td>Joki tugas / ujian</td><td>Nilai E hingga skorsing</td></tr><tr><td>Perundungan</td><td>Teguran hingga skorsing</td></tr></table></div>'],

const ovc=()=>{$('#ov').innerHTML=''},acc=()=>document.documentElement.classList.toggle('acc');
const mo=(t,b)=>{$('#ov').innerHTML=`<div class="modal" onclick="if(event.target==this)ovc()"><div class="card"><div class="row"><h2>${t}</h2><button class="btn o" onclick="ovc()">Tutup</button></div>${b}</div></div>`};

<button class="fab l" onclick="acc()" aria-label="Aksesibilitas: perbesar teks dan tingkatkan kontras">♿</button>`}
const K='lapinet_v1',sv=()=>{try{localStorage.setItem(K,JSON.stringify({users,stu,cases,seq}))}catch(e){}};
const rst=`<div class="card"><h3>Data demo</h3><p>Data tersimpan di browser perangkat ini saja. Kembalikan ke data awal bila diperlukan.</p><button class="btn o" onclick="if(confirm('Kembalikan semua data ke data demo awal?')){try{localStorage.removeItem(K)}catch(e){}location.reload()}">Reset data demo</button></div>`;
function render(){const u=S.u;let h=`<header class="top"><img src="${LOGO}" alt="Logo"><div class="brand"><b>LAPINET</b><small>Laporan Informasi Etik</small></div>${u?`<div style="margin-left:auto;text-align:right;font-size:13px">${E(u.n)}<br><small>${RL[u.r]}</small></div><button class="btn g" onclick="S.u=null;S.v='dash';S.sel=null;render()">Keluar</button>`:''}</header>`;
if(u){const m=[['dash','Dashboard']].concat(u.r!='wali'?[['buat','Buat Laporan']]:[],u.r=='komisi'?[['usr','Pengguna']]:[],[['panduan','Panduan']]);
h+=`<div class="nav">${m.map(x=>`<button class="btn ${S.v==x[0]?'':'o'}" onclick="S.v='${x[0]}';S.sel=null;render()">${x[1]}</button>`).join('')}</div>`}
const back=u?'':`<p><button class="btn o" onclick="S.v='dash';render()">← Kembali ke halaman masuk</button></p>`;
h+='<main>'+(S.v=='panduan'?back+guide():!u?login():S.v=='buat'?form():S.v=='usr'?usr()+rst:dash())+'</main>'+foot()+(u&&S.sel?detail():'');
$('#app').innerHTML=h;if($('#tbl'))tbl();sv()}
try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.cases){users=d.users;stu=d.stu;cases=d.cases;seq=d.seq}}catch(e){}
render();
</script></body></html>
